name: Trendline research contract

on:
  push:
    paths:
      - 'research/**'
      - 'configs/tl_research.yaml'
      - 'sim/tl/**'
      - 'tests/test_tl_research_pipeline.py'
      - 'tests/test_tl_events.py'
      - '.github/workflows/trendline-research-contract.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'research/**'
      - 'configs/tl_research.yaml'
      - 'sim/tl/**'
      - 'tests/test_tl_research_pipeline.py'
      - 'tests/test_tl_events.py'
      - '.github/workflows/trendline-research-contract.yml'
      - 'requirements.txt'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest pyyaml
      - run: python -m compileall -q research sim
      - run: pytest -q tests/test_tl_research_pipeline.py tests/test_tl_events.py
      - run: python -m research.run_tl --contract-test
      - run: python -m research.run_tl_events --help
