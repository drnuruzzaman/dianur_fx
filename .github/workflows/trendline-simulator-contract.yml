name: Trendline simulator contract

on:
  push:
    paths:
      - 'research/**'
      - '.github/workflows/trendline-simulator-contract.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/trendline-simulator-contract.yml'
      - 'requirements.txt'

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: python -m compileall -q research
      - run: pytest -q tests/test_tl_research_pipeline.py
