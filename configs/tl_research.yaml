# Registered research configuration. Values here define the experiment; the
# runner must never optimize these values against the final OOS set.
execution_timeframe: 15m
context_timeframes: [1h, 4h, d1]
tolerances: [0.05, 0.10]
instruments: [EURUSD, XAUUSD, USDJPY]
hypotheses: [bounce, breakout, breakout_retest]
min_sample: 200

# Strategy parameters are registered before the experiment.
strategies:
  bounce:
    no_break_bars: 5
    rejection_max_bars: 1
  breakout:
    continuation_atr: 0.25
  breakout_retest:
    retest_max_bars: 12
    retest_distance_atr: 0.40
    rejection_max_bars: 1

# Execution/barrier model. Trade barriers are resolved using 5m_high_low/15m H/L as the
# selected finer resolution for this project; structural trendline BREAK remains
# the detector's registered structural definition.
barrier_resolution: 5m_high_low

# Research splits. Fill with the project's actual available date ranges before
# the first authoritative run.
walk_forward:
  enabled: true
  train_days: 365
  validation_days: 90
  test_days: 90
  step_days: 90

# Report metadata.
report:
  format: html
  include_csv: true
  include_json: true
