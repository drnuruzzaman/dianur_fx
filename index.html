<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiaNurFx — Charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='13' height='13' fill='%23171C8F'/%3E%3Crect x='17' y='2' width='13' height='13' fill='%23FF9E1B'/%3E%3Crect x='2' y='17' width='13' height='13' fill='%2393C90F'/%3E%3Crect x='17' y='17' width='13' height='13' fill='%23E31C79'/%3E%3C/svg%3E">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="0" y="0" width="14" height="14" fill="#171C8F"/>
      <rect x="18" y="0" width="14" height="14" fill="#FF9E1B"/>
      <rect x="0" y="18" width="14" height="14" fill="#93C90F"/>
      <rect x="18" y="18" width="14" height="14" fill="#E31C79"/>
      <rect x="9" y="9" width="14" height="14" fill="#B1B3B3"/>
    </svg>
    <span class="brand-name">DiaNur<em>Fx</em></span>
  </div>

  <button class="tb symbol-btn" id="symbolBtn" title="Change symbol (/)">
    <span id="symbolLabel">—</span><kbd>/</kbd>
  </button>

  <div class="tb-group" id="tfGroup" role="group" aria-label="Timeframe"></div>

  <div class="tb-group">
    <button class="tb" id="typeBtn" title="Chart type">Candles ▾</button>
    <button class="tb" id="indBtn" title="Indicators (f)">ƒ Indicators</button>
    <button class="tb" id="drawBtn" title="Drawing tools">✎ Draw</button>
    <button class="tb" id="autoBtn" title="Algorithmic trendlines (l)">⌑ Auto TL</button>
    <button class="tb" id="layoutBtn" title="Chart layout">▦ Layout</button>
  </div>

  <div class="spacer"></div>

  <div class="acct" id="acct">
    <div class="acct-cell"><span>Balance</span><b id="acBal">—</b></div>
    <div class="acct-cell"><span>Equity</span><b id="acEq">—</b></div>
    <div class="acct-cell"><span>Floating</span><b id="acPl">—</b></div>
    <div class="acct-cell"><span>Margin free</span><b id="acFree">—</b></div>
  </div>

  <button class="pill" id="healthPill" title="Bridge status">connecting…</button>
</header>

<main class="workspace">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <span>Watchlist</span>
      <button class="icon-btn" id="wlAdd" title="Add symbol">+</button>
    </div>
    <div class="wl-head"><span>Symbol</span><span>Bid</span><span>Chg%</span></div>
    <div class="wl" id="watchlist"></div>
    <div class="side-head"><span>Session</span></div>
    <div class="sessions" id="sessions"></div>
  </aside>

  <section class="charts" id="grid" data-layout="1"></section>

  <aside class="rightbar" id="rightbar">
    <div class="side-head"><span>Time &amp; Sales</span><span class="mono dim" id="tapeSym">—</span></div>
    <div class="tape-head"><span>Time</span><span>Price</span><span>Bid/Ask</span></div>
    <div class="tape" id="tape"></div>
    <div class="side-head"><span>Contract</span></div>
    <div class="spec" id="spec"></div>
  </aside>
</main>

<footer class="bottom" id="bottom">
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="positions">Positions <b id="posCount">0</b></button>
    <button class="tab" data-tab="orders">Orders <b id="ordCount">0</b></button>
    <button class="tab" data-tab="deals">History</button>
    <button class="tab" data-tab="calendar">Calendar</button>
    <button class="tab" data-tab="backtest">Backtest</button>
    <div class="spacer"></div>
    <span class="ro-badge" title="The MT5 bridge exposes no trading endpoints">READ&nbsp;ONLY</span>
    <div class="panel-size">
      <button class="size-btn" id="bottomToggle" title="Collapse panel">–</button>
      <button class="size-btn" id="bottomExpand" title="Expand panel">□</button>
    </div>
  </div>
  <div class="panel" id="panel"></div>
</footer>

<div class="modal" id="searchModal" hidden>
  <div class="modal-box">
    <input id="searchInput" type="text" placeholder="Search symbol — EURUSD, XAUUSD, US30…" autocomplete="off" spellcheck="false">
    <div class="results" id="searchResults"></div>
    <div class="modal-foot"><kbd>↑</kbd><kbd>↓</kbd> move <kbd>↵</kbd> select <kbd>esc</kbd> close</div>
  </div>
</div>

<div class="menu" id="menu" hidden></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
